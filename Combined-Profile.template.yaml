# 组合配置模板：订阅只当节点来源；三层 DNS / AI / 其他 各选各的节点。
# 端口和 TUN 由 Clash Verge 的基础设置提供，这里不写。尖括号 <…> 是要替换的地方。

mode: rule
ipv6: false
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true

# 每个订阅一段：名字自己起（会成为节点名前缀），path 填这个订阅在 profiles 目录里的文件名。
# 只有一个订阅就删掉「订阅B」这段，并把下面所有 use 里的「订阅B」去掉；订阅更多就照样往下加。
proxy-providers:
  订阅A:
    type: file
    path: ./profiles/<订阅A的文件名>.yaml
    interval: 3600
    exclude-filter: '剩余|到期|套餐|官网|客服|邮箱|重置|过期|支持AI|Traffic|Expire|Reset'
    exclude-type: 'direct'
    override:
      additional-prefix: '[订阅A] '
  订阅B:
    type: file
    path: ./profiles/<订阅B的文件名>.yaml
    interval: 3600
    exclude-filter: '剩余|到期|套餐|官网|客服|邮箱|重置|过期|支持AI|Traffic|Expire|Reset'
    exclude-type: 'direct'
    override:
      additional-prefix: '[订阅B] '

proxy-groups:
  # AI 层：第一项是「拒绝」，没选过或选中的节点消失时直接断开，不会悄悄换出口。
  # 只列支持 AI 的地区的节点；机场注明了哪些节点能用 AI 时，按机场的说明改 filter。
  - name: AI
    type: select
    proxies: [REJECT]
    use: [订阅A, 订阅B]
    filter: '新加坡|狮城|台湾|日本|韩国|美国|加拿大|英国|德国|法国|荷兰|澳大利亚|Singapore|Taiwan|Japan|Korea|United States|USA|Canada|United Kingdom|Germany|France|Netherlands|Australia'
    exclude-filter: '香港|澳门|中国|俄罗斯|伊朗|朝鲜|Hong Kong|HongKong|Macau|China|Russia'
  # 其他层：其余所有需要代理的流量。
  - name: 其他
    type: select
    use: [订阅A, 订阅B]
  # DNS 层：Clash 自己查境外域名时从这里出去。第一项在几个稳定节点间自动切换；没有直连选项。
  - name: DNS
    type: select
    proxies: ['DNS 自动']
    use: [订阅A, 订阅B]
  - name: 'DNS 自动'
    type: fallback
    use: [订阅A, 订阅B]
    filter: '新加坡|狮城|日本|台湾|Singapore|Japan|Taiwan'
    exclude-filter: '高倍|[2-9]x|[2-9]X|x[2-9]|香港|Hong Kong'
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
  # 广告开关：PASS = 关闭（继续往下匹配），REJECT = 开启。
  - name: 广告拦截
    type: select
    proxies: [PASS, REJECT]

rule-providers:
  ai-inline:
    type: inline
    behavior: classical
    payload:
      # Net.Coffee「Claude Code 域名分流规则大全」
      - DOMAIN-SUFFIX,anthropic.com
      - DOMAIN-SUFFIX,claude.ai
      - DOMAIN-SUFFIX,claude.com
      - DOMAIN-SUFFIX,clau.de
      - DOMAIN-SUFFIX,claudemcpclient.com
      - DOMAIN-SUFFIX,claudemcpcontent.com
      - DOMAIN-SUFFIX,claudeusercontent.com
      - DOMAIN,servd-anthropic-website.b-cdn.net
      - DOMAIN,anthropic.com.cdn.cloudflare.net
      - DOMAIN,anthropic.auth0.com
      - DOMAIN,anthropic-com.ghost.io
      - DOMAIN-SUFFIX,sentry.io
      - DOMAIN-SUFFIX,statsigapi.net
      - DOMAIN,browser-intake-us5-datadoghq.com
      - DOMAIN-KEYWORD,datadog
      - DOMAIN-KEYWORD,sift
      - DOMAIN-SUFFIX,intercom.io
      - DOMAIN-SUFFIX,intercomcdn.com
      - DOMAIN,cdn.usefathom.com
      # 审查补的功能开关域名
      - DOMAIN,api.statsig.com
      - DOMAIN-SUFFIX,featuregates.org
      # AI 登录和验证码（多家 AI 共用，和 AI 页面同一个出口，验证才不会因 IP 不一致失败）
      - DOMAIN,accounts.google.com
      - DOMAIN,challenges.cloudflare.com
      - DOMAIN-SUFFIX,recaptcha.net
      - DOMAIN,recaptchaenterprise.googleapis.com
      - DOMAIN-SUFFIX,hcaptcha.com
      - DOMAIN-SUFFIX,arkoselabs.com
      - DOMAIN-SUFFIX,funcaptcha.com
      - DOMAIN,appleid.apple.com
      - DOMAIN-SUFFIX,stripe.com
      - DOMAIN-SUFFIX,stripe.network
      # 上游 AI 列表没收的
      - DOMAIN-SUFFIX,character.ai
      - DOMAIN-SUFFIX,characterai.io
      - DOMAIN-SUFFIX,suno.com
      - DOMAIN-SUFFIX,suno.ai
      - DOMAIN,sydney.bing.com
      - DOMAIN,edgeservices.bing.com
      # 你自己要加进 AI 层的域名写在这里（DNS 也会自动跟着走 AI 层）
  ai-exclude:
    type: inline
    behavior: domain
    payload:
      # 上游 AI 列表里收得太宽的：LivePerson（很多网站的客服插件）、Envato（素材站全站）
      - '+.liveperson.net'
      - '+.lpsnmedia.net'
      - '+.envato.com'
      - '+.envato-static.com'
      - '+.envatousercontent.com'
      - '+.themeforest.net'
  ai-list:
    type: http
    behavior: domain
    format: yaml
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.yaml'
    path: ./ruleset/meta-ai-noncn.yaml
    interval: 86400
    proxy: 其他
  loyal-private:
    type: http
    behavior: domain
    format: yaml
    url: 'https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt'
    path: ./ruleset/loyal-private.yaml
    interval: 86400
    proxy: 其他
  loyal-reject:
    type: http
    behavior: domain
    format: yaml
    url: 'https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt'
    path: ./ruleset/loyal-reject.yaml
    interval: 86400
    proxy: 其他
  loyal-proxy:
    type: http
    behavior: domain
    format: yaml
    url: 'https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt'
    path: ./ruleset/loyal-proxy.yaml
    interval: 86400
    proxy: 其他
  loyal-direct:
    type: http
    behavior: domain
    format: yaml
    url: 'https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt'
    path: ./ruleset/loyal-direct.yaml
    interval: 86400
    proxy: 其他
  loyal-lancidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: 'https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt'
    path: ./ruleset/loyal-lancidr.yaml
    interval: 86400
    proxy: 其他
  loyal-cncidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: 'https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt'
    path: ./ruleset/loyal-cncidr.yaml
    interval: 86400
    proxy: 其他
  loyal-telegramcidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: 'https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt'
    path: ./ruleset/loyal-telegramcidr.yaml
    interval: 86400
    proxy: 其他

rules:
  # HTTP/3（QUIC）一律拒绝，浏览器会立刻改用普通 HTTPS：出口更一致，域名识别更准。
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # AI 层：自己写的 Claude 清单最先匹配，不依赖上游。
  - RULE-SET,ai-inline,AI
  - GEOSITE,anthropic,AI
  # 上游 AI 列表里收得太宽的两家送去「其他」，其余进 AI 层。
  - RULE-SET,ai-exclude,其他
  - RULE-SET,ai-list,AI
  # Anthropic 的 IP 段兜底：域名规则失效时的最后一道防线。
  - IP-CIDR,160.79.104.0/21,AI,no-resolve
  - IP-CIDR6,2607:6bc0::/32,AI,no-resolve
  - IP-ASN,399358,AI,no-resolve
  # 通用规则：Loyalsoldier。
  - RULE-SET,loyal-private,DIRECT
  - RULE-SET,loyal-reject,广告拦截
  - RULE-SET,loyal-proxy,其他
  - RULE-SET,loyal-direct,DIRECT
  - RULE-SET,loyal-lancidr,DIRECT,no-resolve
  - RULE-SET,loyal-telegramcidr,其他,no-resolve
  - RULE-SET,loyal-cncidr,DIRECT
  - MATCH,其他

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # 只放必须拿到真实地址的域名；某个程序在 TUN 下出问题时，再把它的域名加到这里。
    # 局域网和保留域名：这些名字本来就不该出局域网
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - '*.home.arpa'
    - '*.localhost'
    - '*.test'
    - '*.example'
    - '*.invalid'
    # 对时：对时程序会缓存地址，拿到假 IP 容易对时失败
    - '+.pool.ntp.org'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - 'time1.*.com'
    - 'time2.*.com'
    - 'time3.*.com'
    - 'time4.*.com'
    - 'time5.*.com'
    - 'time6.*.com'
    - 'time7.*.com'
    - 'ntp.*.com'
    - 'ntp1.*.com'
    - 'ntp2.*.com'
    - 'ntp3.*.com'
    - 'ntp4.*.com'
    - 'ntp5.*.com'
    - 'ntp6.*.com'
    - 'ntp7.*.com'
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - 'time1.cloud.tencent.com'
    # Windows 联网检测：拿到假 IP 会让任务栏显示「无 Internet」
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    # STUN：网页通话、P2P 穿透要用真实地址
    - 'stun.*.*'
    - 'stun.*.*.*'
    # QQ 快捷登录：必须解析到 127.0.0.1
    - 'localhost.ptlogin2.qq.com'
  use-hosts: true
  respect-rules: false
  prefer-h3: false
  # 只用来解析下面 DoH 地址里的域名（这里写的全是 IP，基本用不到）。
  default-nameserver: [223.5.5.5, 119.29.29.29]
  # 固定例外：代理节点自身的地址，直连国内加密 DNS（阿里 + 腾讯）。
  proxy-server-nameserver: ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
  # 直连网站的解析也按下面的 DNS 规则表走。
  direct-nameserver: ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
  direct-nameserver-follow-policy: true
  # DNS 规则表第 4 条：其余所有域名，经 DNS 层节点查境外 DoH。
  nameserver: ['https://1.1.1.1/dns-query#DNS', 'https://8.8.8.8/dns-query#DNS']
  # DNS 规则表（从上往下匹配）
  nameserver-policy:
    'rule-set:ai-exclude': ['https://1.1.1.1/dns-query#DNS', 'https://8.8.8.8/dns-query#DNS']
    # 1. AI 清单 + 你自己加的域名 → AI 层节点
    'rule-set:ai-inline': ['https://1.1.1.1/dns-query#AI', 'https://8.8.8.8/dns-query#AI']
    'geosite:anthropic': ['https://1.1.1.1/dns-query#AI', 'https://8.8.8.8/dns-query#AI']
    'rule-set:ai-list': ['https://1.1.1.1/dns-query#AI', 'https://8.8.8.8/dns-query#AI']
    # 2. 局域网、私有域名 → 系统 DNS（路由器或热点分配的）
    'rule-set:loyal-private': ['system']
    # 3. 国内域名 → 国内加密 DNS 直连
    'rule-set:loyal-direct': ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, '8080-8880']
    TLS:
      ports: [443, 8443, 9443]
    QUIC:
      ports: [443]
  skip-domain:
    - +.apple.co
    - Mijia Cloud
    - dlg.io.mi.com
    - +.oray.com
    - +.sunlogin.net
    - +.push.apple.com
